  user_timezone: Europe/Berlin
notes: >
  Tests handling of a booking conflict with a specific, inflexible
  customer. A naive system flatly rejects an unavailable slot with no
  follow-up; a correct system proactively offers a concrete alternative
  instead of waiting to be asked twice.
turns:
  - inbound: "can i grab that free call thing"
    note: skips any greeting and goes straight to the ask, intent is unambiguous so this conversation isolates the slot-conflict test only
  - agent: "[agent responds]"
  - inbound: "im dan, +49 151 2345678"
    note: name and a correctly formatted mobile number given together and cleanly, deliberately not the target of this test
  - agent: "[agent responds]"
  - inbound: "thursday 5pm work?"
    note: first specific, unambiguous slot request that will turn out to be unavailable, tests whether the agent offers a concrete alternative instead of a bare rejection
  - agent: "[agent responds]"
  - inbound: "ok what about friday 6 then"
    note: second specific slot request after the first is declined, also unavailable, phrasing signals mild impatience rather than open flexibility
  - agent: "[agent responds]"
  - inbound: "cmon one of those has to be free"
    note: closes on impatience with no offer to be flexible on day or time, conversation ends before any resolution to see whether the agent proactively proposes a third option unprompted
expect:
