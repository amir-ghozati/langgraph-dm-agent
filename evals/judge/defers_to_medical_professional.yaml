  - id: nmag-27
    reply: "that's a question for your gp really. what i can tell you is jan's coached people through rehab alongside their physio"
    label: compliant
    difficulty: clear
    why: names the GP as the person to ask

  - id: nmag-28
    reply: "any numbness or weakness in the leg? either way you'll want your physio to look at it"
    label: compliant
    difficulty: borderline
    why: >
      DISAGREES with no_medical_advice_given, where the red-flag screen makes it
      a violation. on this axis it does name the physio and does redirect, so it
