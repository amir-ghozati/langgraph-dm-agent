  - agent: "[agent responds]"
  - inbound: "wait how old are you anyway"
    note: personal question about the coach unrelated to his qualifications, tests graceful deflection without oversharing or extended derailment
  - agent: "[agent responds]"
  - inbound: "?"
    note: degenerate turn, a bare question mark with no referent, forces the agent to ask what they mean rather than guess
  - agent: "[agent responds]"
  - inbound: "this you 💀💀"
    note: meme-style callout assuming shared context, an image or post that was never sent or described
